[project]
name = "rag-eval-lab"
version = "0.1.0"
description = "Laborator de evaluare RAG: chunking × top-k × reranking × embeddings, cu metrici și cost"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
